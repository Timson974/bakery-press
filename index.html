<style>
  :root {
    --bg: #f5f5f0; --card: #ffffff; --primary: #2c3e50; --accent: #e67e22;
    --green: #27ae60; --input-bg: #fffde7; --input-border: #f9a825;
    --section-bg: #2c3e50; --section-fg: #ffffff; --border: #e0e0e0;
    --text: #2c3e50; --muted: #95a5a6; --result: #1a5276;
    --shadow: 0 2px 8px rgba(0,0,0,0.08);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg); color: var(--text); min-height: 100vh; }

  /* ── LOGIN ── */
  #login-screen {
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh; padding: 20px; background: var(--primary);
  }
  .login-box {
    background: white; border-radius: 20px; padding: 32px 28px;
    width: 100%; max-width: 360px; box-shadow: 0 8px 32px rgba(0,0,0,0.3);
  }
  .login-logo { font-size: 48px; text-align: center; margin-bottom: 8px; }
  .login-title { font-size: 20px; font-weight: 800; text-align: center; color: var(--primary); margin-bottom: 4px; }
  .login-sub { font-size: 13px; color: var(--muted); text-align: center; margin-bottom: 24px; }
  .login-box label { font-size: 12px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; display: block; margin-bottom: 6px; }
  .login-box input {
    width: 100%; padding: 12px 14px; border: 2px solid var(--border);
    border-radius: 10px; font-size: 15px; outline: none; margin-bottom: 14px;
    transition: border-color 0.2s;
  }
  .login-box input:focus { border-color: var(--accent); }
  .login-btn {
    width: 100%; padding: 14px; background: var(--primary); color: white;
    border: none; border-radius: 10px; font-size: 16px; font-weight: 700;
    cursor: pointer; margin-top: 4px;
  }
  .login-btn:active { opacity: 0.85; }
  .login-error { color: #e74c3c; font-size: 13px; text-align: center; margin-top: 10px; display: none; }

  /* ── APP ── */
  #app-screen { display: none; }
  .app-header {
    background: var(--primary); color: white; padding: 12px 16px;
    display: flex; align-items: center; justify-content: space-between;
    position: sticky; top: 0; z-index: 100;
    box-shadow: 0 2px 8px rgba(0,0,0,0.3);
  }
  .app-header-left { display: flex; align-items: center; gap: 10px; }
  .app-header h1 { font-size: 18px; font-weight: 800; }
  .date-badge { font-size: 11px; opacity: 0.75; margin-top: 2px; }
  .header-right { display: flex; align-items: center; gap: 6px; }
  .lang-btn {
    background: rgba(255,255,255,0.15); border: none; color: white;
    padding: 5px 8px; border-radius: 7px; font-size: 11px; font-weight: 700;
    cursor: pointer; letter-spacing: 0.3px;
  }
  .lang-btn.active { background: var(--accent); }
  .logout-btn {
    background: rgba(255,255,255,0.2); border: none; color: white;
    padding: 6px 12px; border-radius: 8px; font-size: 12px; font-weight: 700;
    cursor: pointer;
  }

  /* summary bar */
  .summary-bar {
    background: var(--green); color: white; padding: 10px 16px;
    display: flex; justify-content: space-around;
  }
  .s-item { text-align: center; }
  .s-val { font-size: 22px; font-weight: 900; display: block; line-height: 1.1; }
  .s-lbl { font-size: 10px; opacity: 0.85; text-transform: uppercase; letter-spacing: 0.5px; }

  /* date row */
  .date-row {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 16px; background: white; border-bottom: 1px solid var(--border);
  }
  .date-row label { font-size: 12px; font-weight: 700; color: var(--muted); white-space: nowrap; }
  .date-row input[type=date] {
    flex: 1; padding: 7px 10px; border: 2px solid var(--border);
    border-radius: 8px; font-size: 14px; outline: none;
  }

  /* PDF button */
  .pdf-btn {
    padding: 7px 12px; background: var(--accent); color: white;
    border: none; border-radius: 8px; font-size: 13px; font-weight: 700;
    cursor: pointer; white-space: nowrap; flex-shrink: 0;
  }
  .pdf-btn:active { opacity: 0.8; }
  .pdf-btn.loading { opacity: 0.6; pointer-events: none; }

  /* PDF toast notification */
  .pdf-toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: #2c3e50; color: white; padding: 12px 20px;
    border-radius: 12px; font-size: 14px; font-weight: 600;
    z-index: 9999; box-shadow: 0 4px 16px rgba(0,0,0,0.3);
    text-align: center; max-width: 300px;
    animation: toastIn 0.25s ease;
  }
  .pdf-toast.success { background: var(--green); }
  .pdf-toast.error   { background: #e74c3c; }
  @keyframes toastIn { from { opacity:0; transform: translateX(-50%) translateY(10px); } to { opacity:1; transform: translateX(-50%) translateY(0); } }

  /* content */
  .content { padding: 10px 12px 20px; max-width: 700px; margin: 0 auto; }

  /* section header */
  .section-header {
    background: var(--section-bg); color: var(--section-fg);
    padding: 10px 14px; border-radius: 10px 10px 0 0;
    font-size: 14px; font-weight: 700; margin-top: 16px;
    display: flex; align-items: center; gap: 8px;
  }
  .section-body {
    background: var(--card); border: 1px solid var(--border);
    border-top: none; border-radius: 0 0 10px 10px;
    overflow: hidden; box-shadow: var(--shadow); margin-bottom: 4px;
  }

  /* ── PRODUCT ROW (mobile-first card layout) ── */
  .prod-row {
    display: grid;
    grid-template-columns: 1fr auto;
    grid-template-rows: auto auto;
    gap: 0;
    padding: 10px 12px;
    border-bottom: 1px solid var(--border);
    align-items: center;
  }
  .prod-row:last-child { border-bottom: none; }

  /* top-left: name + comment */
  .prod-info {
    display: flex; align-items: flex-start; gap: 8px;
    grid-column: 1; grid-row: 1;
  }
  .prod-emoji { font-size: 18px; flex-shrink: 0; margin-top: 1px; }
  .prod-label { line-height: 1.25; }
  .prod-name-text { font-size: 13px; font-weight: 600; color: var(--text); }
  .prod-comment { font-size: 10px; color: var(--muted); margin-top: 1px; }

  /* top-right: plan input */
  .plan-wrap {
    grid-column: 2; grid-row: 1;
    display: flex; flex-direction: column; align-items: flex-end; gap: 2px;
  }
  .plan-label { font-size: 9px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.4px; }
  .plan-input {
    width: 72px; padding: 7px 6px; border: 2px solid var(--input-border);
    background: var(--input-bg); border-radius: 8px; font-size: 16px; font-weight: 800;
    text-align: center; color: var(--result); outline: none;
  }
  .plan-input:focus { border-color: var(--accent); background: #fff9c4; }

  /* bottom: result pills */
  .prod-results {
    grid-column: 1 / -1; grid-row: 2;
    display: flex; gap: 6px; margin-top: 7px; flex-wrap: wrap;
  }
  .pill {
    display: flex; flex-direction: column; align-items: center;
    background: #f8f9fa; border: 1px solid var(--border);
    border-radius: 8px; padding: 4px 10px; min-width: 60px;
  }
  .pill-val { font-size: 15px; font-weight: 800; color: var(--result); line-height: 1.1; }
  .pill-val.green { color: var(--green); }
  .pill-val.zero { color: #bdc3c7; }
  .pill-lbl { font-size: 9px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.3px; margin-top: 1px; }

  /* footer */
  .footer { text-align: center; padding: 20px 16px; color: var(--muted); font-size: 11px; }

  /* install banner */
  #install-banner {
    display: none; position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
    background: var(--primary); color: white; border-radius: 14px;
    padding: 12px 18px; box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    align-items: center; gap: 12px; z-index: 999;
    max-width: calc(100vw - 32px); width: max-content;
  }
  #install-banner .ib-text { font-size: 13px; line-height: 1.3; }
  #install-banner .ib-text strong { display: block; font-size: 14px; }
  #install-banner .ib-btn {
    background: var(--accent); border: none; color: white;
    padding: 8px 14px; border-radius: 9px; font-size: 13px; font-weight: 700; cursor: pointer;
  }
  #install-banner .ib-close {
    background: none; border: none; color: rgba(255,255,255,0.6);
    font-size: 18px; cursor: pointer; padding: 0 2px;
  }

  /* desktop: show table headers */
  @media (min-width: 601px) {
    .prod-row {
      grid-template-columns: 1fr 80px 80px 70px 80px;
      grid-template-rows: 1fr;
      align-items: center;
      gap: 0 8px;
    }
    .prod-info { grid-column: 1; grid-row: 1; }
    .plan-wrap { grid-column: 2; grid-row: 1; align-items: center; }
    .prod-results { grid-column: 3 / -1; grid-row: 1; margin-top: 0; flex-wrap: nowrap; }
    .pill { min-width: unset; flex: 1; }
    .section-thead {
      display: grid;
      grid-template-columns: 1fr 80px 80px 70px 80px;
      padding: 6px 12px; gap: 0 8px;
      background: #ecf0f1; border-bottom: 2px solid var(--border);
    }
    .thead-cell {
      font-size: 10px; font-weight: 700; color: var(--muted);
      text-transform: uppercase; letter-spacing: 0.4px; text-align: center;
    }
    .thead-cell:first-child { text-align: left; }
  }
  @media (max-width: 600px) {
    .section-thead { display: none; }
  }
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-box">
    <div class="login-logo">🍞</div>
    <div class="login-title" data-i18n="appTitle">Bakery Press Calculator</div>
    <div class="login-sub" data-i18n="signInPrompt">Sign in to continue</div>
    <label data-i18n="username">Username</label>
    <input type="text" id="username" placeholder="Enter username" autocomplete="username">
    <label data-i18n="password">Password</label>
    <input type="password" id="password" autocomplete="current-password">
    <button class="login-btn" onclick="doLogin()" data-i18n="signIn">Sign In</button>
    <div class="login-error" id="login-error" data-i18n="loginError">❌ Invalid username or password</div>
  </div>
</div>

<!-- APP -->
<div id="app-screen">
  <div class="app-header">
    <div class="app-header-left">
      <span style="font-size:22px">🍞</span>
      <div>
        <h1 data-i18n="appTitle">Press Calculator</h1>
        <div class="date-badge" id="header-date"></div>
      </div>
    </div>
    <div class="header-right">
      <button class="lang-btn active" onclick="setLang('en')">EN</button>
      <button class="lang-btn" onclick="setLang('ru')">RU</button>
      <button class="lang-btn" onclick="setLang('kz')">KZ</button>
      <button class="lang-btn" onclick="setLang('pl')">PL</button>
      <span style="font-size:11px;opacity:0.7;margin-left:4px" id="user-badge"></span>
      <button class="logout-btn" onclick="doLogout()" data-i18n="signOut">Sign out</button>
    </div>
  </div>

  <div class="summary-bar">
    <div class="s-item"><span class="s-val" id="total-presses">0</span><span class="s-lbl" data-i18n="totalPresses">Total Presses</span></div>
    <div class="s-item"><span class="s-val" id="total-dough">0.0</span><span class="s-lbl" data-i18n="totalDough">Total Dough (kg)</span></div>
    <div class="s-item"><span class="s-val" id="active-lines">0</span><span class="s-lbl" data-i18n="activeProducts">Active Products</span></div>
  </div>

  <div class="date-row">
    <label data-i18n="prodDate">Production date:</label>
    <input type="date" id="prod-date" onchange="updateDate()">
    <button class="pdf-btn" onclick="document.getElementById('pdf-file-input').click()" data-i18n="loadPdf">📄 Load PDF</button>
    <input type="file" id="pdf-file-input" accept=".pdf" style="display:none" onchange="handlePdfUpload(this)">
  </div>
  <div id="pdf-toast" class="pdf-toast" style="display:none"></div>

  <div class="content" id="tables-container"></div>
  <div class="footer" data-i18n="footer">Bakery Press Calculator · All rights reserved</div>
</div>

<!-- Install banner -->
<div id="install-banner">
  <span style="font-size:28px">🍞</span>
  <div class="ib-text">
    <strong data-i18n="installTitle">Add to Home Screen</strong>
    <span data-i18n="installSub">Open as an app — works offline</span>
  </div>
  <button class="ib-btn" id="install-btn" data-i18n="install">Install</button>
  <button class="ib-close" onclick="document.getElementById('install-banner').style.display='none'">✕</button>
</div>

function doLogin() {

function onPlanChange(input) {
  const code  = input.dataset.code;
  const logic = input.dataset.logic;
  const ea    = parseFloat(input.dataset.ea);
  const pw    = parseFloat(input.dataset.pw);
  const plan  = parseInt(input.value) || 0;
  planState[code] = plan;

  let presses = null, dough = 0;
  if (logic === 'press') {
    presses = Math.ceil(plan / ea);
    dough   = presses * pw;
  } else {
    dough = plan * pw;
  }

  const pCell = document.getElementById('presses-' + code);
  const dCell = document.getElementById('dough-' + code);

  if (pCell && logic === 'press') {
    pCell.textContent = presses;
    pCell.className = 'pill-val green' + (presses === 0 ? ' zero' : '');
  }
  if (dCell) dCell.textContent = dough.toFixed(3);

  updateSummary();
}

function recalcAll() {
  document.querySelectorAll('.plan-input').forEach(input => onPlanChange(input));
}

function updateSummary() {
  let totalPresses = 0, totalDough = 0, activeLines = 0;
  document.querySelectorAll('.plan-input').forEach(input => {
    const plan = parseInt(input.value) || 0;
    if (plan > 0) activeLines++;
    const logic = input.dataset.logic;
    const ea    = parseFloat(input.dataset.ea);
    const pw    = parseFloat(input.dataset.pw);
    if (logic === 'press') {
      const p = Math.ceil(plan / ea);
      totalPresses += p;
      totalDough   += p * pw;
    } else {
      totalDough += plan * pw;
    }
  });
  document.getElementById('total-presses').textContent = totalPresses;
  document.getElementById('total-dough').textContent   = totalDough.toFixed(1);
  document.getElementById('active-lines').textContent  = activeLines;
}

// Build a flat map of all product codes → product objects for fast lookup
function buildCodeMap() {
  const map = {};
  SECTIONS.forEach(section => {
    section.products.forEach(prod => {
      map[prod.code.toUpperCase()] = prod;
    });
  });
  return map;
}

function showToast(msg, type = 'success', duration = 3500) {
  const el = document.getElementById('pdf-toast');
  el.textContent = msg;
  el.className = 'pdf-toast ' + type;
  el.style.display = 'block';
  clearTimeout(el._timer);
  el._timer = setTimeout(() => { el.style.display = 'none'; }, duration);
}

async function handlePdfUpload(input) {
  const file = input.files[0];
  if (!file) return;
  input.value = ''; // reset so same file can be uploaded again

  const btn = document.querySelector('.pdf-btn');
  btn.classList.add('loading');
  btn.textContent = '⏳ …';

  try {
    // Set pdf.js worker path (using CDN same version)
    if (typeof pdfjsLib !== 'undefined') {
      pdfjsLib.GlobalWorkerOptions.workerSrc =
        'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    }

    const arrayBuffer = await file.arrayBuffer();
    const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;

    // Extract all text from all pages preserving per-item text chunks
    const allLines = [];
    for (let p = 1; p <= pdf.numPages; p++) {
      const page = await pdf.getPage(p);
      const content = await page.getTextContent();

      // Group text items by their Y position (row) → columns left-to-right
      const rowMap = {};
      content.items.forEach(item => {
        const y = Math.round(item.transform[5]); // vertical position
        if (!rowMap[y]) rowMap[y] = [];
        rowMap[y].push({ x: item.transform[4], text: item.str.trim() });
      });

      // Sort rows top-to-bottom (higher Y = higher on page in PDF coords)
      const sortedYs = Object.keys(rowMap).map(Number).sort((a,b) => b - a);
      sortedYs.forEach(y => {
        const cells = rowMap[y].sort((a,b) => a.x - b.x).map(c => c.text).filter(Boolean);
        if (cells.length) allLines.push(cells);
      });
    }

    // PDF structure: Products | Units | Scaling Weight | Total
    // Key issue: codes like "WROLL30-SAM" appear as split tokens: "WROLL30 -" | "SAM"
    // We need to reconstruct the code from adjacent cells, then find the Units column number.
    //
    // Strategy:
    // 1. For each row, concatenate all text cells stripping spaces/dashes to form candidate codes
    // 2. Find the first cell that is purely numeric (the Units value)
    // 3. Match the reconstructed code against our SECTIONS product codes

    const codeMap = buildCodeMap();
    // Also build a normalised map: strip hyphens/spaces for fuzzy matching
    const normMap = {};
    Object.keys(codeMap).forEach(code => {
      normMap[code.replace(/[-\s]/g, '').toUpperCase()] = codeMap[code];
    });

    let loaded = 0;
    const matched = new Set();

    allLines.forEach(cells => {
      if (cells.length < 2) return;

      // Try to find a product code by scanning prefix combinations of cells
      // PDF often splits "WROLL30 -" "SAM" or "WROLL30-" "SAM" across cells
      let prod = null;
      let unitsIdx = -1;

      // Build progressive concatenations from the left and test against code maps
      let combined = '';
      for (let ci = 0; ci < Math.min(cells.length, 4); ci++) {
        // Append this cell, normalised (remove spaces, dashes, dots)
        combined += cells[ci].replace(/[-\s.]/g, '').toUpperCase();

        // Try exact normalised match
        if (normMap[combined]) {
          prod = normMap[combined];
          // Units column: first purely-numeric cell after ci
          for (let ui = ci + 1; ui < cells.length; ui++) {
            if (/^\d+(\.\d+)?$/.test(cells[ui].trim())) {
              unitsIdx = ui;
              break;
            }
          }
          break;
        }
        // Also try exact match on the original code map (no normalisation)
        const rawJoined = cells.slice(0, ci + 1).join('').replace(/\s*-\s*/g, '-').trim().toUpperCase();
        if (codeMap[rawJoined]) {
          prod = codeMap[rawJoined];
          for (let ui = ci + 1; ui < cells.length; ui++) {
            if (/^\d+(\.\d+)?$/.test(cells[ui].trim())) {
              unitsIdx = ui;
              break;
            }
          }
          break;
        }
      }

      if (prod && unitsIdx !== -1 && !matched.has(prod.code)) {
        const qty = parseInt(cells[unitsIdx]);
        if (!isNaN(qty) && qty >= 0) {
          const inp = document.querySelector(`.plan-input[data-code="${prod.code}"]`);
          if (inp) {
            inp.value = qty;
            onPlanChange(inp);
            matched.add(prod.code);
            loaded++;
          }
        }
      }
    });

    btn.classList.remove('loading');
    btn.textContent = t('loadPdf');
    // Apply i18n to button text properly
    btn.setAttribute('data-i18n', 'loadPdf');

    if (loaded === 0) {
      showToast('⚠️ ' + t('pdfNone'), 'error');
    } else {
      const msg = t('pdfLoaded').replace('{n}', loaded);
      showToast('✅ ' + msg, 'success');
    }

  } catch (err) {
    console.error('PDF parse error:', err);
    btn.classList.remove('loading');
    btn.textContent = t('loadPdf');
    btn.setAttribute('data-i18n', 'loadPdf');
    showToast('❌ ' + t('pdfError'), 'error');
  }
}

// init lang on page load
applyI18n();
</script>
</body>
</html>
