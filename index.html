<style>
  :root {
    --bg: #f5f5f0;
    --card: #ffffff;
    --primary: #2c3e50;
    --accent: #e67e22;
    --green: #27ae60;
    --input-bg: #fffde7;
    --input-border: #f9a825;
    --section-bg: #2c3e50;
    --section-fg: #ffffff;
    --border: #e0e0e0;
    --text: #2c3e50;
    --muted: #95a5a6;
    --result: #1a5276;
    --shadow: 0 2px 8px rgba(0,0,0,0.08);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', Arial, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

  /* ── LOGIN ── */
  #login-screen {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    min-height: 100vh; background: linear-gradient(135deg, #2c3e50 0%, #34495e 100%);
    padding: 24px;
  }
  .login-box {
    background: white; border-radius: 16px; padding: 40px 32px; width: 100%; max-width: 380px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
  }
  .login-logo { font-size: 48px; text-align: center; margin-bottom: 8px; }
  .login-title { text-align: center; font-size: 22px; font-weight: 700; color: var(--primary); margin-bottom: 4px; }
  .login-sub { text-align: center; font-size: 13px; color: var(--muted); margin-bottom: 28px; }
  .login-box label { display: block; font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }
  .login-box input {
    width: 100%; padding: 12px 16px; border: 2px solid var(--border); border-radius: 10px;
    font-size: 15px; outline: none; transition: border-color 0.2s; margin-bottom: 16px;
  }
  .login-box input:focus { border-color: var(--accent); }
  .login-btn {
    width: 100%; padding: 14px; background: var(--accent); color: white; border: none;
    border-radius: 10px; font-size: 16px; font-weight: 700; cursor: pointer;
    transition: background 0.2s, transform 0.1s;
  }
  .login-btn:hover { background: #d35400; }
  .login-btn:active { transform: scale(0.98); }
  .login-error { color: #e74c3c; font-size: 13px; text-align: center; margin-top: 10px; display: none; }

  /* ── APP ── */
  #app-screen { display: none; }
  .app-header {
    background: var(--primary); color: white; padding: 14px 16px;
    display: flex; align-items: center; justify-content: space-between;
    position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 8px rgba(0,0,0,0.2);
  }
  .app-header-left { display: flex; align-items: center; gap: 10px; }
  .app-header h1 { font-size: 17px; font-weight: 700; }
  .app-header .date-badge {
    background: rgba(255,255,255,0.15); border-radius: 20px;
    padding: 3px 10px; font-size: 12px;
  }
  .logout-btn {
    background: rgba(255,255,255,0.15); border: none; color: white;
    padding: 6px 12px; border-radius: 8px; cursor: pointer; font-size: 13px;
  }
  .logout-btn:hover { background: rgba(255,255,255,0.25); }

  /* summary bar */
  .summary-bar {
    background: var(--green); color: white;
    display: flex; justify-content: space-around; padding: 10px 16px;
    font-size: 13px; gap: 8px; flex-wrap: wrap;
  }
  .summary-bar .s-item { text-align: center; }
  .summary-bar .s-val { font-size: 20px; font-weight: 800; display: block; line-height: 1; }
  .summary-bar .s-lbl { font-size: 11px; opacity: 0.85; }

  /* date input */
  .date-row {
    padding: 12px 16px; background: white; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  }
  .date-row label { font-size: 13px; font-weight: 600; color: var(--muted); }
  .date-row input[type=date] {
    padding: 7px 12px; border: 2px solid var(--border); border-radius: 8px;
    font-size: 14px; outline: none;
  }
  .date-row input[type=date]:focus { border-color: var(--accent); }

  /* content */
  .content { padding: 12px 16px; max-width: 900px; margin: 0 auto; }

  /* section */
  .section-header {
    background: var(--section-bg); color: var(--section-fg);
    padding: 10px 14px; border-radius: 10px 10px 0 0;
    font-size: 14px; font-weight: 700; margin-top: 18px;
    display: flex; align-items: center; gap: 8px;
  }
  .section-body { background: var(--card); border: 1px solid var(--border); border-top: none; border-radius: 0 0 10px 10px; overflow: hidden; box-shadow: var(--shadow); margin-bottom: 4px; }

  /* table */
  .press-table { width: 100%; border-collapse: collapse; }
  .press-table thead th {
    background: #ecf0f1; font-size: 11px; font-weight: 700; color: var(--muted);
    text-transform: uppercase; letter-spacing: 0.4px; padding: 8px 10px;
    text-align: center; border-bottom: 2px solid var(--border);
  }
  .press-table thead th:first-child { text-align: left; }
  .press-table tbody tr { border-bottom: 1px solid var(--border); }
  .press-table tbody tr:last-child { border-bottom: none; }
  .press-table tbody tr:hover { background: #fafafa; }
  .press-table td { padding: 9px 10px; vertical-align: middle; }
  .prod-name { font-size: 13px; font-weight: 500; display: flex; align-items: center; gap: 6px; }
  .prod-emoji { font-size: 16px; }
  .prod-label { line-height: 1.2; }
  .prod-comment { font-size: 10px; color: var(--muted); margin-top: 1px; }

  /* input cells */
  .plan-input {
    width: 70px; padding: 6px 8px; border: 2px solid var(--input-border);
    background: var(--input-bg); border-radius: 7px; font-size: 14px; font-weight: 700;
    text-align: center; color: var(--result); outline: none; transition: border-color 0.2s;
  }
  .plan-input:focus { border-color: var(--accent); background: #fff9c4; }
  .num-cell { text-align: center; font-size: 13px; color: var(--muted); }
  .presses-cell {
    text-align: center; font-size: 20px; font-weight: 800;
    color: var(--green); min-width: 50px;
  }
  .presses-cell.zero { color: #bdc3c7; }
  .dough-cell {
    text-align: center; font-size: 14px; font-weight: 700; color: var(--result);
  }
  .dash { color: #ddd; }

  /* mobile tweaks */
  @media (max-width: 600px) {
    .press-table thead th:nth-child(3),
    .press-table tbody td:nth-child(3) { display: none; } /* hide Ea/Press on mobile */
    .plan-input { width: 60px; font-size: 13px; }
    .presses-cell { font-size: 18px; }
  }

  /* footer */
  .footer { text-align: center; padding: 20px 16px; color: var(--muted); font-size: 11px; }

  /* ── INSTALL BANNER ── */
  #install-banner {
    display: none; position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
    background: var(--primary); color: white; border-radius: 14px;
    padding: 12px 18px; box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    display: none; align-items: center; gap: 12px; z-index: 999;

  #install-banner .ib-text { font-size: 13px; line-height: 1.3; }
  #install-banner .ib-text strong { display: block; font-size: 14px; }
  #install-banner .ib-btn {
    background: var(--accent); border: none; color: white;
    padding: 8px 14px; border-radius: 9px; font-size: 13px; font-weight: 700;
    cursor: pointer; white-space: nowrap;
  }
  #install-banner .ib-close {
    background: none; border: none; color: rgba(255,255,255,0.6);
    font-size: 18px; cursor: pointer; padding: 0 2px; line-height: 1;
  }
</style>

// ── LOGIN ─────────────────────────────────────────────────────────────────────
function doLogin() {
  const u = document.getElementById('username').value.trim().toLowerCase();
  const p = document.getElementById('password').value;
  if (USERS[u] && USERS[u].pass === p) {
    currentUser = { username: u, role: USERS[u].role };
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('app-screen').style.display = 'block';
    document.getElementById('user-badge').textContent = `👤 ${USERS[u].role}`;
    initApp();
  } else {
    document.getElementById('login-error').style.display = 'block';
  }
}
function doLogout() {
  currentUser = null;
  document.getElementById('app-screen').style.display = 'none';
  document.getElementById('login-screen').style.display = 'flex';
  document.getElementById('username').value = '';
  document.getElementById('password').value = '';
  document.getElementById('login-error').style.display = 'none';
}
document.getElementById('password').addEventListener('keydown', e => { if(e.key==='Enter') doLogin(); });

  // set today's date
  const today = new Date();
  const dateStr = today.toISOString().split('T')[0];
  document.getElementById('prod-date').value = dateStr;
  updateDate();
  buildTables();
  recalcAll();
}

function updateDate() {
  const d = document.getElementById('prod-date').value;
  if (!d) return;
  const dt = new Date(d + 'T12:00:00');
  document.getElementById('header-date').textContent = dt.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short',year:'numeric'});
}

function buildTables() {
  const container = document.getElementById('tables-container');
  container.innerHTML = '';

  SECTIONS.forEach(section => {
    const wrap = document.createElement('div');

    // Section header
    const hdr = document.createElement('div');
    hdr.className = 'section-header';
    hdr.innerHTML = `<span>${section.icon}</span><span>${section.title}</span>`;
    wrap.appendChild(hdr);

    // Table
    const body = document.createElement('div');
    body.className = 'section-body';

    const tbl = document.createElement('table');
    tbl.className = 'press-table';
    tbl.innerHTML = `<thead><tr>
      <th style="text-align:left">Product</th>
      <th>Plan (qty)</th>
      <th>Ea / Press</th>
      <th>Press Wt (kg)</th>
      <th>Presses</th>
      <th>Dough (kg)</th>
    </tr></thead>`;

    const tbody = document.createElement('tbody');
    section.products.forEach(prod => {
      planState[prod.code] = prod.plan;
      const tr = document.createElement('tr');
      const emoji = EMOJI[prod.code] || '🍞';

      const eaCell  = prod.logic === 'press' ? prod.ea   : '–';
      const pwCell  = prod.pw.toFixed(3);

      tr.innerHTML = `
        <td class="prod-name">
          <span class="prod-emoji">${emoji}</span>
          <div class="prod-label">
            <div>${prod.name}</div>
            <div class="prod-comment">${prod.comment}</div>
          </div>
        </td>
        <td class="num-cell">
          <input class="plan-input" type="number" min="0" value="${prod.plan}"
            data-code="${prod.code}" data-logic="${prod.logic}"
            data-ea="${prod.logic==='press'?prod.ea:0}" data-pw="${prod.pw}"
            oninput="onPlanChange(this)">
        </td>
        <td class="num-cell">${eaCell}</td>
        <td class="num-cell">${pwCell}</td>
        <td class="presses-cell" id="presses-${prod.code}">–</td>
        <td class="dough-cell"  id="dough-${prod.code}">–</td>
      `;
      tbody.appendChild(tr);
    });

    tbl.appendChild(tbody);
    body.appendChild(tbl);
    wrap.appendChild(body);
    container.appendChild(wrap);
  });
}

function onPlanChange(input) {
  const code  = input.dataset.code;
  const logic = input.dataset.logic;
  const ea    = parseFloat(input.dataset.ea);
  const pw    = parseFloat(input.dataset.pw);
  const plan  = parseInt(input.value) || 0;
  planState[code] = plan;

  let presses = null, dough = 0;
  if (logic === 'press') {
    presses = Math.ceil(plan / ea);
    dough   = presses * pw;
  } else {
    dough = plan * pw;
  }

  const pCell = document.getElementById('presses-' + code);
  const dCell = document.getElementById('dough-' + code);

  if (logic === 'press') {
    pCell.textContent = presses;
    pCell.className = 'presses-cell' + (presses === 0 ? ' zero' : '');
  } else {
    pCell.innerHTML = '<span class="dash">–</span>';
  }
  dCell.textContent = dough.toFixed(3);

  updateSummary();
}

function recalcAll() {
  document.querySelectorAll('.plan-input').forEach(input => onPlanChange(input));
}

// ── PWA INSTALL PROMPT ───────────────────────────────────────────────────────
let deferredPrompt = null;
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  deferredPrompt = e;
  const banner = document.getElementById('install-banner');
  banner.style.display = 'flex';
});
document.getElementById('install-btn').addEventListener('click', async () => {
  if (!deferredPrompt) return;
  deferredPrompt.prompt();
  const { outcome } = await deferredPrompt.userChoice;
  deferredPrompt = null;
  document.getElementById('install-banner').style.display = 'none';
});
window.addEventListener('appinstalled', () => {
  document.getElementById('install-banner').style.display = 'none';
  deferredPrompt = null;
});

function updateSummary() {
  let totalPresses = 0, totalDough = 0, activeLines = 0;
  document.querySelectorAll('.plan-input').forEach(input => {
    const plan = parseInt(input.value) || 0;
    if (plan > 0) activeLines++;
    const logic = input.dataset.logic;
    const ea    = parseFloat(input.dataset.ea);
    const pw    = parseFloat(input.dataset.pw);
    if (logic === 'press') {
      const p = Math.ceil(plan / ea);
      totalPresses += p;
      totalDough   += p * pw;
    } else {
      totalDough += plan * pw;
    }
  });
  document.getElementById('total-presses').textContent = totalPresses;
  document.getElementById('total-dough').textContent   = totalDough.toFixed(1);
  document.getElementById('active-lines').textContent  = activeLines;
}
</script>
</body>
</html>
